<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding: 40px;
    }
    .card {
      background: white;
      padding: 30px;
      max-width: 600px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
    }
    p {
      color: #555;
      font-size: 18px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #0077ff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
    a:hover {
      background: #005fcc;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Bem-vindo ao meu site!</h1>
    <p>Este site foi criado gratuitamente usando GitHub Pages.</p>
    <a href="#">Meu contato</a>
  </div>

</body>
</html>
